<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Gabrielle Essence Eau De Parfum | Product Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="product" aria-labelledby="product-title">

      <picture class="product__media">
        <source media="(min-width: 40em)" srcset="./images/image-product-desktop.jpg">
        <img 
          src="./images/image-product-mobile.jpg" 
          alt="Gabrielle Essence Eau De Parfum bottle next to its white box" 
          class="product__image"
        >
      </picture>

      <div class="product__content">
        <p class="product__category">Perfume</p>

        <h1 id="product-title" class="product__title">Gabrielle Essence Eau De Parfum</h1>

        <p class="product__description">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.
        </p>

        <p class="product__pricing">
          <span class="product__price-current">$149.99</span>
          <s class="product__price-old">$169.99</s>
        </p>

        <button class="product__btn" type="button">
          <svg width="15" height="16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path 
              d="M14.383 10.388a2.397 2.397 0 0 0-1.518-2.222l1.494-5.593a.803.803 0 0 0-.144-.695.8.8 0 0 0-.631-.28H2.637L2.373.591A.8.8 0 0 0 1.598 0H.803a.8.8 0 0 0 0 1.6h.146l1.7 12.752a2.4 2.4 0 0 0 2.377 2.048h5.95a2.4 2.4 0 0 0 2.377-2.048l.243-1.864H5.31a.8.8 0 0 1 0-1.6h8.858c.636 0 1.215-.502 1.215-1.5ZM5.026 14.8a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6Zm6.953 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6Z" 
              fill="currentColor" 
              fill-rule="nonzero"
            />
          </svg>
          Add to Cart
        </button>
      </div>

    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/K0Teu4" target="_blank" rel="noopener noreferrer">K0Teu4</a>.
  </footer>
</body>
</html>
